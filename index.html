<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机英语单词拼写</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }
        .word-card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
        }
        .hint-area {
            margin: 10px 0;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机单词拼写练习</h1>
        
        <!-- 单词展示卡片 -->
        <div class="word-card">
            <h3>单词释义：<span id="word-meaning">点击开始获取单词</span></h3>
            <p>难度：<span id="word-level">-</span></p>
            <!-- 新增：提示区域 -->
            <div class="hint-area" id="hint-area">
                提示：<span id="hint-text">暂无</span>
            </div>
        </div>

        <!-- 操作按钮区域 -->
        <div class="d-flex gap-2 mb-3 justify-content-center">
            <button class="btn btn-outline-secondary" id="hint-btn">显示提示</button>
            <button class="btn btn-secondary" id="next-btn">下一个单词</button>
            <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#allWordsModal">查看全部单词</button>
        </div>

        <!-- 输入和验证区域 -->
        <div class="input-group mb-3">
            <input type="text" id="user-input" class="form-control" placeholder="请输入单词拼写">
            <button class="btn btn-primary" id="check-btn">验证</button>
        </div>

        <!-- 反馈区域 -->
        <div class="feedback" id="feedback"></div>

        <!-- 统计区域 -->
        <div class="mt-4">
            <p>答题总数：<span id="total">0</span> | 正确数：<span id="correct">0</span> | 正确率：<span id="rate">0%</span></p>
        </div>
    </div>

    <!-- 新增：全部单词模态框 -->
    <div class="modal fade" id="allWordsModal" tabindex="-1" aria-labelledby="allWordsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="allWordsModalLabel">全部单词列表</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row" id="all-words-list">
                        <!-- 单词列表会通过JS动态生成 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
